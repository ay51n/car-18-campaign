<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e244d" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- SHIELD CREST (Left) -->
  <g transform="translate(10, 5)">
    <!-- Outer Shadow Shield -->
    <path d="M 60 5 Q 90 5 110 20 Q 115 70 60 115 Q 5 70 10 20 Q 30 5 60 5 Z" fill="#020817" opacity="0.6" transform="translate(2, 3)" />
    
    <!-- Outer Silver Shield -->
    <path d="M 60 5 Q 90 5 110 20 Q 115 70 60 115 Q 5 70 10 20 Q 30 5 60 5 Z" fill="url(#silverGrad)" />
    
    <!-- Inner Dark Shield -->
    <path d="M 60 9 Q 87 9 105 22 Q 110 68 60 110 Q 10 68 15 22 Q 33 9 60 9 Z" fill="url(#shieldGrad)" />
    
    <!-- Thin Golden Accent Line -->
    <path d="M 60 12 Q 85 12 101 24 Q 105 66 60 106 Q 15 66 19 24 Q 35 12 60 12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
    
    <!-- 3 Stars -->
    <g fill="url(#goldGrad)" transform="translate(60, 20)">
      <!-- Center Star -->
      <path d="M 0,-5 L 1.5,-1.5 L 5,-1.5 L 2,1 L 3.5,4.5 L 0,2.5 L -3.5,4.5 L -2,1 L -5,-1.5 L -1.5,-1.5 Z" transform="scale(0.85)" />
      <!-- Left Star -->
      <path d="M 0,-5 L 1.5,-1.5 L 5,-1.5 L 2,1 L 3.5,4.5 L 0,2.5 L -3.5,4.5 L -2,1 L -5,-1.5 L -1.5,-1.5 Z" transform="translate(-16, 2) scale(0.65)" />
      <!-- Right Star -->
      <path d="M 0,-5 L 1.5,-1.5 L 5,-1.5 L 2,1 L 3.5,4.5 L 0,2.5 L -3.5,4.5 L -2,1 L -5,-1.5 L -1.5,-1.5 Z" transform="translate(16, 2) scale(0.65)" />
    </g>

    <!-- Subtitle Banner: AUTO MOTO ÉCOLE -->
    <rect x="22" y="27" width="76" height="13" rx="2" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8" />
    <text x="60" y="36.5" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="6.8" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTO MOTO ÉCOLE</text>

    <!-- Center Big CAR 18 -->
    <text x="60" y="66" font-family="'Impact', 'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" stroke="#0a192f" stroke-width="0.8">CAR 18</text>

    <!-- Lower Graphic: Highway Perspective & Sports Car Silhouette -->
    <!-- Road lines -->
    <polygon points="60,69 48,102 72,102" fill="#1e293b" opacity="0.7" />
    <line x1="60" y1="72" x2="60" y2="78" stroke="#facc15" stroke-width="1.5" stroke-dasharray="2,2" />
    <line x1="60" y1="81" x2="60" y2="89" stroke="#facc15" stroke-width="2" stroke-dasharray="3,2" />
    <line x1="60" y1="92" x2="60" y2="102" stroke="#facc15" stroke-width="2.5" />

    <!-- Stylized modern sports car emblem in silver -->
    <path d="M 44,92 Q 47,84 60,83 Q 73,84 76,92 Q 78,95 72,96 Q 60,94 48,96 Q 42,95 44,92 Z" fill="url(#silverGrad)" />
    <ellipse cx="51" cy="93" rx="2.5" ry="1.2" fill="#38bdf8" />
    <ellipse cx="69" cy="93" rx="2.5" ry="1.2" fill="#38bdf8" />
    <!-- Wing mirrors & windshield -->
    <path d="M 52,86 L 56,84 L 64,84 L 68,86 Z" fill="#0f172a" />
  </g>

  <!-- TEXT TYPOGRAPHY (Right) -->
  <g transform="translate(135, 30)">
    <!-- Main CAR 18 Brand Name -->
    <text x="0" y="44" font-family="'Montserrat', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">
      CAR 18
    </text>
    <!-- Subtitle: AUTO MOTO ÉCOLE -->
    <text x="2" y="68" font-family="'Montserrat', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#fbbf24" letter-spacing="5">
      AUTO MOTO ÉCOLE
    </text>
    <!-- Paris 18 Badge -->
    <rect x="2" y="78" width="138" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="87" r="3.5" fill="#22c55e" />
    <text x="22" y="90" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="1">PARIS 18e • RUE JOSEPH DIJON</text>
  </g>
</svg>
